[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astrodaily"
version = "0.1.0"
description = "AstroDaily backend: Vedic astrology calculation API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyswisseph>=2.10.3",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "google-auth>=2.30",
    "requests>=2.32",
    "pyjwt>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["astrodaily*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
